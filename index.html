<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic Tac Toe</title>

    <style>
      :root {
        --bg: #0b1020;
        --surface: rgba(255, 255, 255, 0.08);
        --surface-2: rgba(255, 255, 255, 0.12);
        --border: rgba(255, 255, 255, 0.14);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.68);
        --shadow: 0 14px 38px rgba(0, 0, 0, 0.45);
        --radius: 18px;
        --gap: 12px;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --surface: rgba(0, 0, 0, 0.04);
          --surface-2: rgba(0, 0, 0, 0.06);
          --border: rgba(0, 0, 0, 0.08);
          --text: rgba(0, 0, 0, 0.88);
          --muted: rgba(0, 0, 0, 0.6);
          --shadow: 0 14px 38px rgba(0, 0, 0, 0.12);
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 800px at 10% 10%, #6d28d9 0%, transparent 55%),
          radial-gradient(1100px 700px at 90% 20%, #22c55e 0%, transparent 55%),
          radial-gradient(900px 600px at 40% 95%, #0ea5e9 0%, transparent 55%),
          var(--bg);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: min(520px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        overflow: hidden;
      }

      header {
        padding: 22px 22px 16px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-2);
      }

      header h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.4px;
      }

      .sub {
        color: var(--muted);
        font-size: 13px;
        display: flex;
        gap: 10px;
        align-items: center;
        white-space: nowrap;
      }

      .pill {
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
      }

      main { padding: 22px; }

      /* ===== Board quadrado de verdade ===== */
      .board-wrap {
        width: min(360px, 100%);
        margin: 0 auto;
        aspect-ratio: 1 / 1;           /* garante tabuleiro quadrado */
      }

      .board {
        width: 100%;
        height: 100%;                  /* preenche o wrap quadrado */
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--gap);
      }

      .cell {
        position: relative;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: var(--surface);
        display: grid;
        place-items: center;
        font-size: clamp(28px, 6vw, 44px);
        user-select: none;
        overflow: hidden;
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      }

      .cell:hover {
        transform: translateY(-1px);
        background: var(--surface-2);
      }

      .cell:active {
        transform: translateY(0px) scale(0.99);
      }

      /* checkbox invisível, mas clicável */
      .cell input[type="checkbox"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }

      footer {
        padding: 16px 22px 22px;
        display: flex;
        justify-content: center;
      }

      .gameover {
        display: none;
        width: 100%;
        text-align: center;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        font-size: 14px;
      }

      .gameover.show {
        display: block;
        animation: pop 180ms ease-out;
      }

      @keyframes pop {
        from { transform: translateY(6px); opacity: 0; }
        to   { transform: translateY(0); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .cell, .gameover { transition: none; animation: none; }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <header>
        <h1>Tic Tac Toe</h1>
        <div class="sub">
          <span class="pill">Humano: 🧑‍💻</span>
          <span class="pill">Bot: 🤖</span>
        </div>
      </header>

      <main>
        <div class="board-wrap" aria-label="Tabuleiro do jogo da velha">
          <div class="board" id="board">
            <div class="cell"><input type="checkbox" aria-label="célula 1" /></div>
            <div class="cell"><input type="checkbox" aria-label="célula 2" /></div>
            <div class="cell"><input type="checkbox" aria-label="célula 3" /></div>
            <div class="cell"><input type="checkbox" aria-label="célula 4" /></div>
            <div class="cell"><input type="checkbox" aria-label="célula 5" /></div>
            <div class="cell"><input type="checkbox" aria-label="célula 6" /></div>
            <div class="cell"><input type="checkbox" aria-label="célula 7" /></div>
            <div class="cell"><input type="checkbox" aria-label="célula 8" /></div>
            <div class="cell"><input type="checkbox" aria-label="célula 9" /></div>
          </div>
        </div>
      </main>

      <footer>
        <div class="gameover" id="gameover">
          Game over — recarregue a página para jogar de novo 🧑‍💻 🤖
        </div>
      </footer>
    </div>

    <script>
      // Initialize
      const boxes = Array.from(document.querySelectorAll(".cell"));
      const inputs = Array.from(document.querySelectorAll("[type=checkbox]"));

      const getRow = (r) => boxes.slice((r - 1) * 3, (r - 1) * 3 + 3);
      const getCol = (c) => [boxes[c - 1], boxes[c - 1 + 3], boxes[c - 1 + 6]];

      const rows = [1, 2, 3].map(getRow);
      const columns = [1, 2, 3].map(getCol);
      const diagonals = [
        [boxes[0], boxes[4], boxes[8]],
        [boxes[6], boxes[4], boxes[2]],
      ];

      const gameOver = document.querySelector("#gameover");
      const HUMAN = "🧑‍💻";
      const ROBOT = "🤖";

      // Decide who goes first
      if (Math.random() > 0.5) {
        runRobotTurn();
      }

      // Handle when a user clicks an input
      for (const input of inputs) {
        input.addEventListener("click", handleClickInput);
      }

      function handleClickInput(evt) {
        evt.target.closest(".cell").innerHTML = HUMAN;
        if (hasWin()) return endGame();

        runRobotTurn();
        if (hasWin()) return endGame();
      }

      function runRobotTurn() {
        const robotBoxes = shuffle(boxes);
        while (robotBoxes.length) {
          const box = robotBoxes.shift();
          if (box.querySelector("input")) {
            box.innerHTML = ROBOT;
            break;
          }
        }
      }

      function hasWin() {
        return (
          rows.some(hasAllSame) ||
          columns.some(hasAllSame) ||
          diagonals.some(hasAllSame)
        );
      }

      function hasAllSame(arr) {
        return arr.every(
          (cell) => !cell.querySelector("input") && cell.innerHTML === arr[0].innerHTML
        );
      }

      function endGame() {
        gameOver.classList.add("show");
        for (const input of inputs) {
          input.removeEventListener("click", handleClickInput);
          input.remove();
        }
      }

      function shuffle(array) {
        array = array.slice(0);
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * i);
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }
    </script>
  </body>
</html>
